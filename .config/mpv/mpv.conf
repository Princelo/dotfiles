# 1. Performance & Hardware Acceleration
# Enables Apple VideoToolbox for low CPU/battery usage
hwdec=auto-safe

# Modern GPU rendering backend (best visual quality on macOS)
vo=gpu-next

# Fixes window scaling issues on Mac Retina/HiDPI displays
no-hidpi-window-scale

# 2. Smooth Playback (No Stutter / Judder)
# Syncs video frame rate to display refresh rate (resamples audio slightly)
video-sync=display-resample

# Smooth motion interpolation for 24fps content
interpolation=yes

# 3. Audio & Subtitles
# Native macOS audio backend
ao=coreaudio

# Load external subtitles matching video filename automatically
sub-auto=fuzzy

# 4. Behavior & Quality of Life
# Save video playback position on exit (resumes where you left off)
save-position-on-quit=yes
